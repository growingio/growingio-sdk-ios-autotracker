name: SPM

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  spm-build:
    strategy:
      matrix:
        target: [
          iOS,
          macOS,
          macCatalyst,
          tvOS,
          watchOS,
        ]
        os: [macos-15]
        include:
          - os: macos-15
            xcode: Xcode_16.4
          - target: iOS
            destination: generic/platform=iOS Simulator
          - target: macOS
            destination: platform=macOS
          - target: macCatalyst
            destination: platform=macOS,variant=Mac Catalyst
          - target: tvOS
            destination: generic/platform=tvOS Simulator
          - target: watchOS
            destination: generic/platform=watchOS Simulator
          - scheme: GrowingAnalytics-Package
            target: iOS
          - scheme: GrowingAutotracker
            target: macCatalyst
          - scheme: GrowingAutotracker
            target: tvOS
          - scheme: GrowingTracker
            target: macOS
          - scheme: GrowingTracker
            target: watchOS
          - target: visionOS
            os: macos-15
            xcode: Xcode_16.4
            destination: generic/platform=visionOS Simulator
            scheme: GrowingTracker
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -switch /Applications/${{ matrix.xcode }}.app
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build -scheme ${{ matrix.scheme }} -destination '${{ matrix.destination }}' \
          | xcbeautify --renderer github-actions