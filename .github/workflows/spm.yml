name: SPM

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  spm-build:
    strategy:
      # 一个平台失败时不连带取消其余平台，否则看不到它们的真实状态
      fail-fast: false
      matrix:
        target: [
          iOS,
          macOS,
          macCatalyst,
          tvOS,
          watchOS,
          visionOS,
        ]
        # 支持下限与当前版本各验一遍。macOS 26 镜像上没有任何 Xcode 16.x，
        # 因此两条腿必须配两个镜像；待 macos-15 弃用时需同步抬高下限
        toolchain:
          - { os: macos-15, xcode: Xcode_16.4 }
          - { os: macos-26, xcode: Xcode_26.6 }
        include:
          - target: iOS
            destination: generic/platform=iOS Simulator
            scheme: GrowingAnalytics-Package
          - target: macOS
            destination: platform=macOS
            scheme: GrowingTracker
          - target: macCatalyst
            destination: platform=macOS,variant=Mac Catalyst
            scheme: GrowingAutotracker
          - target: tvOS
            destination: generic/platform=tvOS Simulator
            scheme: GrowingAutotracker
          - target: watchOS
            destination: generic/platform=watchOS Simulator
            scheme: GrowingTracker
          - target: visionOS
            destination: generic/platform=visionOS Simulator
            scheme: GrowingTracker
    runs-on: ${{ matrix.toolchain.os }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -switch /Applications/${{ matrix.toolchain.xcode }}.app
      - name: Build
        run: |
          set -euo pipefail
          xcodebuild build -scheme ${{ matrix.scheme }} -destination '${{ matrix.destination }}' \
          | xcbeautify --renderer github-actions
